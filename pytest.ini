[pytest]

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    -q
    --disable-warnings
    --strict-markers

markers =
    smoke: quick sanity tests
    regression: full regression suite
    ui: UI tests
    api: API tests
    e2e: end-to-end tests