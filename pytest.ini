[pytest]

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --disable-warnings
    --strict-markers

markers =
    smoke: fast representative validation of critical functionality
    regression: broader validation across expanded or full applicable cases
    ui: visibility, presentation, state, and direct behavior of UI elements
    e2e: tests forming the complete primary purchase journey through checkout completion and return to inventory
    security: access control and protected-route tests
    sorting: product sorting tests
    navigation: page-transition tests excluding the authentication login transition